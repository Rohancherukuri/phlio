# Render Blueprint — Phlio backend on the free plan, with real data.
#
# Free web services have no persistent disk, so:
#   * the database is Surreal Cloud (free 1 GB): your local data is imported
#     with `uv run python -m scripts.publish_local_data` (see docs/deploy-render.md);
#   * media, SQLite databases (DMs, videos, music, payments) and DM files live
#     in a Cloudflare R2 bucket: restored on boot, backed up every minute,
#     and /media files redirect to the bucket's public URL.
# Secrets are `sync: false`: fill them in on the Render dashboard.
services:
  - type: web
    name: phlio-backend
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_FORMAT
        value: json
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: REDIS_ENABLED
        value: "false"
      # -- Database (Surreal Cloud) --
      - key: DATABASE_BACKEND
        value: surreal
      - key: SURREAL_URL
        sync: false # wss://<instance>.surreal.cloud/rpc
      - key: SURREAL_USER
        sync: false
      - key: SURREAL_PASSWORD
        sync: false
      - key: SURREAL_NAMESPACE
        value: phlio
      - key: SURREAL_DATABASE
        value: phlio_graph_dev
      # Same file names as local, so the uploaded copies are found on boot.
      - key: MESSAGING_DATABASE
        value: data/phlio_graph_dev_messages.sqlite3
      - key: SOCIAL_VIDEO_DATABASE
        value: data/phlio_graph_dev_videos.sqlite3
      # -- Object storage (Cloudflare R2) --
      - key: OBJECT_STORE_ENDPOINT
        sync: false # https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      - key: OBJECT_STORE_BUCKET
        sync: false
      - key: OBJECT_STORE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORE_SECRET_KEY
        sync: false
      - key: MEDIA_PUBLIC_URL
        sync: false # https://pub-<id>.r2.dev
      - key: ANTHROPIC_API_KEY
        sync: false
