name: phlio
description: >
  Phlio — People. Places. Possibilities. Flutter client implementing the
  Home, Auth, Social, Rooms, Shop, Book, Pay, Activity, and Foxy (Phlio
  Agent) surfaces on top of the Phlio backend API.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# Every dependency below is a well-known, actively maintained package.
# Run `flutter pub get` once after cloning to fetch them before building.
dependencies:
  flutter:
    sdk: flutter

  # -- State management --------------------------------------------------
  flutter_riverpod: ^2.6.1

  # -- Routing --------------------------------------------------------------
  go_router: ^14.6.2

  # -- Networking -------------------------------------------------------------
  dio: ^5.7.0

  # -- Dependency injection (service locator for repositories/data sources) --
  get_it: ^8.0.2

  # -- Local secure storage (JWT access/refresh tokens) ------------------
  flutter_secure_storage: ^9.2.2

  # -- Icons matching the reference UI's outline icon style ----------------
  cupertino_icons: ^1.0.8

  # -- Value equality for entities/state classes without code generation --
  equatable: ^2.0.5

  # -- Relative timestamps ("2h ago") in feeds/rooms/activity/agent chat --
  timeago: ^3.7.0

  # -- QR scanning for Phlio Pay's scan-and-pay flow (CameraX on Android) --
  mobile_scanner: ^7.4.2
  file_picker: ^11.0.3
  record: ^6.2.1
  audioplayers: ^6.7.1
  # Phlio Stream music player: gapless queue + lock-screen / headset controls.
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  # Music audio session (keeps iOS playing with the screen locked).
  audio_session: ">=0.1.24 <0.3.0"
  # Android 13+ notification permission for the playback controls.
  permission_handler: ^12.0.1
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  path_provider: ^2.1.6
  flutter_webrtc: ^1.6.2+hotfix.3
  video_player: ^2.11.1
  pdfrx: ^2.2.24
  archive: ^4.3.0
  xml: ^6.6.1
  video_player_win: ^3.3.0
  share_plus: 11.1.0
  url_launcher: 6.3.2
  livekit_client: ^2.13.1
  country_picker: ^2.0.28
  flutter_contacts: 1.1.9+2
  qr_flutter: 4.1.0
  camera: ^0.12.0+2
  # Two-tone line illustrations (Phlio Book categories).
  flutter_svg: ^2.0.17
  # On-device video gallery for Social uploads (grid, albums, thumbnails).
  photo_manager: ^3.5.0
  # Disk + memory cache for avatars and thumbnails.
  cached_network_image: ^3.4.1
  # Foxy's state-machine animation (assets/rive/foxy.riv when present).
  rive: ^0.13.20
  razorpay_flutter: 1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Lightweight mocking for repository/use-case unit tests (see test/) —
  # chosen over `mockito` because it needs no code generation step.
  mocktail: ^1.0.4

flutter:
  shaders:
    - assets/shaders/dm_album_sheen.frag
    - assets/shaders/phlio_look.frag
    - assets/shaders/retro_glow.frag
  uses-material-design: true

  # Brand assets: the Foxy mascot pose art, logo lockups, the chat sticker
  # pack, the Foxy emoji/costume/text-sticker/GIF pack (sliced from the
  # asset sheet by scripts/media/build_foxy_asset_pack.py) and looping
  # mascot GIFs.
  assets:
    - assets/images/
    - assets/images/foxy/
    - assets/images/logo/
    - assets/images/placeholders/social/
    - assets/images/placeholders/shop/
    - assets/images/placeholders/book/
    - assets/images/book_categories/
    - assets/images/chat_icons/
    - assets/agent/
    - assets/stickers/
    - assets/stickers/moves/
    - assets/emoji/
    - assets/animations/
    - assets/audio/
    - assets/rive/
    - assets/foxy_puppet/

  # Bundled brand typography (assets/fonts/):
  #   Manrope   — the UI workhorse (body copy, labels, buttons)
  #   Quicksand — rounded display face (wordmark, splash/login headlines)
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope-v20-latin-regular.ttf
          weight: 400
        - asset: assets/fonts/manrope-v20-latin-500.ttf
          weight: 500
        - asset: assets/fonts/manrope-v20-latin-600.ttf
          weight: 600
        - asset: assets/fonts/manrope-v20-latin-700.ttf
          weight: 700
        - asset: assets/fonts/manrope-v20-latin-800.ttf
          weight: 800
    - family: Quicksand
      fonts:
        - asset: assets/fonts/quicksand-v37-latin-regular.ttf
          weight: 400
        - asset: assets/fonts/quicksand-v37-latin-500.ttf
          weight: 500
        - asset: assets/fonts/quicksand-v37-latin-600.ttf
          weight: 600
        - asset: assets/fonts/quicksand-v37-latin-700.ttf
          weight: 700